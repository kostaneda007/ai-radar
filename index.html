<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Radar — tech news</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#05070f; --text:#eaf2ff; --muted:#8fa3c0;
    --accent:#4dd6ff; --accent2:#a78bfa;
    --mono:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
  .blob{position:fixed;border-radius:50%;filter:blur(130px);opacity:.45;z-index:-1;animation:float 20s ease-in-out infinite}
  .b1{width:540px;height:540px;background:#1b3cff;top:-180px;left:-140px}
  .b2{width:480px;height:480px;background:#7c3aed;bottom:-160px;right:-120px;animation-delay:-7s}
  .b3{width:400px;height:400px;background:#00e0ff;top:42%;left:62%;opacity:.22;animation-delay:-13s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-35px) scale(1.1)}}
  .glass{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.12)}
  header{max-width:760px;margin:40px auto 0;border-radius:16px 16px 0 0;padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:none}
  .dots span{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .term-title{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .cursor{color:var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hero{max-width:760px;margin:0 auto;padding:34px 24px 26px;border-radius:0 0 24px 24px;text-align:center}
  h1{font-family:var(--mono);font-size:40px;letter-spacing:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-family:var(--mono);color:var(--muted);margin-top:10px;font-size:14px}
  .filters{max-width:760px;margin:20px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{font-family:var(--mono);font-size:12px;color:var(--muted);padding:7px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);cursor:pointer;transition:.2s;backdrop-filter:blur(10px)}
  .chip:hover{color:var(--text);transform:translateY(-2px)}
  .chip.active{color:var(--accent);border-color:rgba(77,214,255,.5);background:rgba(77,214,255,.12)}
  main{max-width:760px;margin:0 auto;padding:28px 16px 70px}
  .card{border-radius:24px;margin-bottom:26px;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease}
  .card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(77,214,255,.15),0 0 0 1px rgba(77,214,255,.25)}
  .imgwrap{position:relative}
  .imgwrap img{width:100%;height:280px;object-fit:cover;display:block}
  .imgwrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,7,15,.85))}
  .body{padding:20px 24px 22px}
  .meta{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tag{color:var(--accent);border:1px solid rgba(77,214,255,.35);background:rgba(77,214,255,.08);padding:3px 12px;border-radius:20px}
  .text{white-space:pre-line;line-height:1.6;font-size:15px;color:#dbe7f7}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
  a.src{font-family:var(--mono);font-size:13px;color:var(--accent2);text-decoration:none;border-bottom:1px dashed rgba(167,139,250,.5);transition:color .2s}
  a.src:hover{color:var(--accent)}
  .socials{display:flex;gap:8px;margin-left:auto}
  .soc{font-family:var(--mono);font-size:12px;text-decoration:none;padding:5px 14px;border-radius:14px;transition:transform .2s ease,box-shadow .2s ease}
  .soc.tg{color:var(--accent);background:rgba(77,214,255,.08);border:1px solid rgba(77,214,255,.35)}
  .soc.vk{color:var(--accent2);background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.35)}
  .soc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(77,214,255,.2)}
  .status{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);padding:10px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<header class="glass">
  <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
  <div class="term-title">~/ai-radar $ tail -f news.feed <span class="cursor">▊</span></div>
</header>
<div class="hero glass">
  <h1>AI RADAR</h1>
  <p class="sub">// авторские tech-новости на русском · выбери тему</p>
</div>

<div class="filters" id="filters"></div>
<main id="feed"><p class="status">загрузка ленты...</p></main>

<script>
const CATS = {all:'все', ai:'AI', startups:'стартапы', gadgets:'гаджеты', dev:'разработка', deep_tech:'диптех', tech_society:'общество', tech_main:'технологии'};
let posts = [], cur = 'all';

function renderChips(){
  document.getElementById('filters').innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<button class="chip ${k===cur?'active':''}" onclick="setCat('${k}')">${v}</button>`).join('');
}
function setCat(k){ cur = k; renderChips(); renderFeed(); }
function renderFeed(){
  const list = posts.filter(p => cur==='all' || p.category===cur);
  const feed = document.getElementById('feed');
  if (!list.length) { feed.innerHTML = '<p class="status">// в этой теме пока нет постов</p>'; return; }
  feed.innerHTML = list.map(p => `
    <article class="card glass">
      ${p.image ? `<div class="imgwrap"><img src="images/${p.image}" alt=""></div>` : ''}
      <div class="body">
        <div class="meta"><span class="tag">#${p.category}</span><span>${p.date}</span></div>
        <div class="text">${p.text}</div>
        <div class="actions">
          <a class="src" href="${p.link}" target="_blank">прочитать источник →</a>
          <span class="socials">
            <a class="soc tg" href="https://t.me/only_his_own_1" target="_blank">Телеграм ↗</a>
            <a class="soc vk" href="https://vk.com/club67225562" target="_blank">Вконтакте ↗</a>
          </span>
        </div>
      </div>
    </article>`).join('');
}

fetch('news.json?ts=' + Date.now())
  .then(r => r.json())
  .then(data => { posts = data; renderChips(); renderFeed(); })
  .catch(() => { document.getElementById('feed').innerHTML = '<p class="status">// ошибка загрузки ленты</p>'; });
</script>
</body>
</html>
